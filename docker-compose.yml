services:
  postgres:
    image: postgres:15-alpine
    container_name: travel-planner-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel-planner-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: travel-planner-auth
    ports:
      - "8001:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  trip-service:
    build:
      context: ./services/trip-service
      dockerfile: Dockerfile
    container_name: travel-planner-trips
    ports:
      - "8002:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: travel-planner-data
    ports:
      - "8003:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/data-service/data:/app/data

  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: travel-planner-ml
    ports:
      - "8004:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: travel-planner-analytics
    ports:
      - "8005:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: travel-planner-grafana
    env_file:
      - .env.docker
    environment:
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL
        - VITE_YANDEX_MAPS_API_TOKEN
        - VITE_GEOAPIFY_API_KEY
        - VITE_YANDEX_GEOSUGGEST_API_KEY
        - VITE_GRAFANA_DASHBOARD_URL
    container_name: travel-planner-frontend
    env_file:
      - .env.docker
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - trip-service
      - data-service
      - ml-service
      - analytics-service
      - grafana

volumes:
  postgres_data:
  redis_data:
  grafana_data:
