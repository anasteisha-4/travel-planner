server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Сжатие Gzip для производительности
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/manifest+json;

    # Важно для PWA: правильный MIME-тип для манифеста
    location ~* \.webmanifest$ {
        root /usr/share/nginx/html;
        add_header Content-Type application/manifest+json;
        expires max;
    }

    # PWA & React Router: все редиректы отправляем на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэширование статических файлов
    location ~* \.(?:css|js|jpg|svg|png|ico|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Проксирование API на бэкенд (auth-service)
    # При запуске вне docker-fallback можно заменить на localhost
    location /api {
        proxy_pass http://auth-service:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
